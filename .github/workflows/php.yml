name: Plugin checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "7.4", "8.3" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd
          coverage: none
      - name: Lint PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run PHP regression suite
        run: php -d error_reporting=E_ALL tests/run.php
      - name: Run admin dashboard regression suite
        run: php -d error_reporting=E_ALL tests/admin-dashboard.test.php
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        run: node --check assets/js/visualizer.js
      - name: Run frontend regression test
        run: node tests/frontend.test.js
